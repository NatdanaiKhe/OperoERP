info:
  name: Create Department
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/department"
  body:
    type: json
    data: |-
      {
        "name": "Engineering",
        "companyId": "{{companyId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
