    data: |-
      {
        "name": "Acme Corp (Thailand)",
        "contactPerson": "John Doe",
        "phone": "+66 2 765 4321",
        "notes": "Priority support - renewed contract"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5