info:
  name: Invite User
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/invite"
  body:
    type: json
    data: |-
      {
        "firstName": "{{firstName}}",
        "lastName": "{{lastName}}",
        "email": "newuser@opero.local",
        "departmentId": "{{departmentId}}",
        "role": "user"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
