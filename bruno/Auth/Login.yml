info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}"
      }
  auth: inherit

  script:
    postResponse: |-
      if (res.body && res.body.accessToken) {
        bru.setEnvVar("accessToken", res.body.accessToken);
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
