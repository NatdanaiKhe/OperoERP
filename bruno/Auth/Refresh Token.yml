info:
  name: Refresh Token
  type: http
  seq: 3

http:
  method: POST
  url: '{{baseUrl}}/auth/refresh'
  auth: inherit

  script:
    postResponse: |-
      if (res.body && res.body.accessToken) {
        bru.setEnvVar("accessToken", res.body.accessToken);
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
