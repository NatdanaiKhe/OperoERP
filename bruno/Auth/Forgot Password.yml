info:
  name: Forgot Password
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
