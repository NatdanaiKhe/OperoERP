info:
  name: Reset Password
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/change-password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{password}}",
        "newPassword": "{{password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
