info:
  name: Reset Password
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "token": "reset-token-here",
        "newPassword": "{{password}}"
      }
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
