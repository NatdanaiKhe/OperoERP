info:
  name: Profile
  type: http
  seq: 4

http:
  method: GET
  url: '{{baseUrl}}/auth/profile'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        if (!Array.isArray(data.permissions)) {
          throw new Error("profile response must include a permissions array");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
