name: Security

on:
  pull_request:
    branches: [main, uat, dev]
  push:
    branches: [main, uat, dev]

jobs:
  # Catches committed API keys, tokens, credentials, etc.
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history allows Gitleaks to inspect the repository history.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

  # Blocks PRs when newly introduced/updated dependencies
  # have known vulnerabilities.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
