name: Security

on:
  pull_request:
    branches: [main, uat, dev]
  push:
    branches: [main, uat, dev]

jobs:
  # --- Catches committed API keys, tokens, credentials before they merge ---
  secret-scan:
    name: Secret scanning
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed so gitleaks can diff the correct commit range
          # (PR: base...head, push: before...after).
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2

  # --- Blocks the PR if a *newly introduced* dependency has a known CVE ---
  # Complements yarn audit: yarn audit checks the whole lockfile every run,
  # this specifically flags what THIS pr is adding/upgrading to.
  dependency-review:
    name: Dependency review
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
