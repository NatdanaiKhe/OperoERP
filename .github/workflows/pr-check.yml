name: PR Checks

# Runs on every PR targeting main/uat/dev.
# Yarn 4 (Berry) workspace monorepo, Turborepo,
# apps/api (NestJS), apps/web (Next.js).

on:
  pull_request:
    branches: [main, uat, dev]

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest

    # CI-only environment.
    # These are disposable credentials and must never point
    # at your real homelab services.
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: ci-test-secret-not-used-in-production
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      # Berry's audit command is `yarn npm audit`.
      # Only high/critical vulnerabilities fail the workflow.
      - name: Audit dependencies
        run: yarn npm audit --severity high --all

      # Run all validation/build tasks through one Turbo invocation.
      - name: Lint, type-check, test, build
        run: yarn turbo run lint typecheck test build
