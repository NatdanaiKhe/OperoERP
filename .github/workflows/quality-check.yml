name: CodeQL

# Runs on pushes, PRs, and weekly on a schedule.
# CodeQL results are uploaded to the repository Security tab.

on:
  push:
    branches: [main, uat, dev]

  pull_request:
    branches: [main, uat, dev]

  schedule:
    # Every Monday at 3:00 AM UTC
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      # No manual build required for JavaScript/TypeScript.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
