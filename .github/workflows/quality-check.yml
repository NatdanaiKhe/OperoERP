name: CodeQL

# Separate from pr-checks.yml on purpose: this also needs to run on pushes
# to main/develop (not just PRs) and on a schedule, to catch new CVEs in
# code that hasn't changed. security-events: write is required to upload
# results to the repo's Security tab.
on:
  push:
    branches: [main, uat, dev]
  pull_request:
    branches: [main, uat, dev]
  schedule:
    # every monday at 3 a.m.
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, Linux, X64]
    permissions: security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      # No manual build step needed — JS/TS is analyzed without compiling.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
